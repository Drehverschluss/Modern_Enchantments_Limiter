modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
issueTrackerURL="https://github.com/Drehverschluss/Modern_Enchantments_Limiter/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL="https://github.com/Drehverschluss/Modern_Enchantments_Limiter"

authors="${mod_authors}"

description='''
Limits how many enchantments a single item can carry, based on a configurable base limit, item rarity bonuses, random variance, and per-tag/per-rarity overrides. Enforced on anvils, enchanting tables, and enchanted books, with a tooltip showing each item's current enchantment count against its limit.
'''

[[mixins]]
config="${mod_id}.mixins.json"

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    # This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
